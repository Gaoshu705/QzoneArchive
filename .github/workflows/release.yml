name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 防止同一个 Tag 重复运行多个发布任务。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Windows ─────────────────────────────────────────
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows
        run: npx tauri build

      - name: Show Windows artifacts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem `
            -Path "src-tauri/target/release/bundle" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
          ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ── macOS x64 ───────────────────────────────────────
  macos-x64:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS x64
        run: npx tauri build --target x86_64-apple-darwin

      - name: Show macOS x64 artifacts
        if: always()
        shell: bash
        run: |
          find \
            src-tauri/target/x86_64-apple-darwin/release/bundle \
            -type f \
            -print || true

      - name: Upload macOS x64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ── macOS ARM64 ─────────────────────────────────────
  macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS ARM64
        run: npx tauri build --target aarch64-apple-darwin

      - name: Show macOS ARM64 artifacts
        if: always()
        shell: bash
        run: |
          find \
            src-tauri/target/aarch64-apple-darwin/release/bundle \
            -type f \
            -print || true

      - name: Upload macOS ARM64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ── Android ─────────────────────────────────────────
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Configure Android environment
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "NDK=$ANDROID_SDK_ROOT/ndk/27.0.12077973"

          test -d "$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Android
        run: npx tauri android build --target aarch64

      - name: Find generated Android artifacts
        if: always()
        shell: bash
        run: |
          find \
            src-tauri/gen/android/app/build/outputs \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          APK_UNSIGNED="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          APK_SIGNED="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"

          if [ ! -f "$APK_UNSIGNED" ]; then
            echo "Unsigned APK not found: $APK_UNSIGNED"

            find \
              src-tauri/gen/android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.jks \
            --ks-key-alias key0 \
            --ks-pass pass:qzonearchive \
            --key-pass pass:qzonearchive \
            --out "$APK_SIGNED" \
            "$APK_UNSIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK_SIGNED"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error

  # ── iOS ARM64 未签名 IPA ─────────────────────────────
  ios:
    # iOS 构建只能在 macOS Runner 上执行。
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Show Xcode version
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version
          xcode-select -p
          rustup target list --installed

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi

          pod --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Tauri CLI
        shell: bash
        run: |
          set -euo pipefail

          npx tauri --version

          if ! npx tauri ios build --help | grep -q -- "--no-sign"; then
            echo "The installed Tauri CLI does not support ios build --no-sign."
            exit 1
          fi

      - name: Initialize iOS project
        shell: bash
        run: |
          set -euo pipefail

          # 仓库目前没有提交 gen/apple，因此在 CI 中生成。
          rm -rf src-tauri/gen/apple
          npx tauri ios init --ci

      - name: Generate iOS app icon
        shell: bash
        run: |
          set -euo pipefail

          npx tauri icon src-tauri/icons/qzone-archive-icon.png --ios-color '#FFFFFF'

          test -f src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/Contents.json
          test -f src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/AppIcon-60x60@3x.png

      - name: Add iOS privacy manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > src-tauri/gen/apple/PrivacyInfo.xcprivacy <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>NSPrivacyAccessedAPITypes</key>
              <array>
                <dict>
                  <key>NSPrivacyAccessedAPIType</key>
                  <string>NSPrivacyAccessedAPICategoryFileTimestamp</string>

                  <key>NSPrivacyAccessedAPITypeReasons</key>
                  <array>
                    <string>C617.1</string>
                  </array>
                </dict>
              </array>
            </dict>
          </plist>
          EOF

          plutil -lint src-tauri/gen/apple/PrivacyInfo.xcprivacy

      - name: Build unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail

          npx tauri ios build \
            --target aarch64 \
            --ci \
            --no-sign \
            --build-number "${{ github.run_number }}"

      - name: Collect unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/ios

          IPA_PATH="$(
            find src-tauri/gen/apple \
              -type f \
              -name "*.ipa" \
              -print \
              -quit
          )"

          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "Unsigned IPA was not generated."

            find src-tauri/gen/apple \
              -type f \
              \( \
                -name "*.ipa" \
                -o -name "*.app" \
                -o -name "*.xcarchive" \
              \) \
              -print || true

            exit 1
          fi

          REF_NAME="${GITHUB_REF_NAME:-manual}"
          SAFE_REF_NAME="${REF_NAME//\//-}"

          OUTPUT_NAME="QzoneArchive-${SAFE_REF_NAME}-ios-arm64-unsigned.ipa"

          cp "$IPA_PATH" "dist/ios/$OUTPUT_NAME"

          echo "Generated IPA:"
          ls -lh "dist/ios/$OUTPUT_NAME"

          shasum -a 256 \
            "dist/ios/$OUTPUT_NAME" \
            > dist/ios/SHA256SUMS-ios.txt

          cat dist/ios/SHA256SUMS-ios.txt

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: |
            dist/ios/*.ipa
            dist/ios/SHA256SUMS-ios.txt
          if-no-files-found: error

  # ── GitHub Release ──────────────────────────────────
  publish:
    needs:
      - windows
      - macos-x64
      - macos-arm64
      - android
      - ios

    runs-on: ubuntu-latest

    # 手动运行工作流时只生成 Actions Artifacts；
    # 推送 v* Tag 时才创建 GitHub Release。
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      actions: read

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Show release files
        shell: bash
        run: |
          set -euo pipefail

          find artifacts \
            -type f \
            -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装说明

            - Windows：下载 `.exe` 安装程序。
            - macOS Intel：下载 `macos-x64` 对应的 `.dmg`。
            - macOS Apple Silicon：下载 `macos-arm64` 对应的 `.dmg`。
            - Android：下载 `.apk`。
            - iOS：提供未签名 IPA，需使用 AltStore、SideStore、Sideloadly
              或其他签名工具重新签名后安装。
            - 未签名 iOS IPA 不能直接安装到普通真机，也不能上传 App Store。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
