name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_windows:
        description: Skip the Windows job
        type: boolean
        default: false
      skip_macos:
        description: Skip both macOS jobs
        type: boolean
        default: false
      skip_linux:
        description: Skip the Linux deb/rpm/AppImage job
        type: boolean
        default: false
      skip_android:
        description: Skip the Android job
        type: boolean
        default: false
      skip_ios:
        description: Skip the iOS job
        type: boolean
        default: false
      skip_nixos:
        description: Skip the NixOS package job
        type: boolean
        default: false

# Prevent duplicate workflow runs for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Windows
  windows:
    runs-on: windows-latest
    if: ${{ ! inputs.skip_windows }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows
        run: npx tauri build

      - name: Show Windows artifacts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem `
            -Path "src-tauri/target/release/bundle" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
          ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # macOS x64
  macos-x64:
    runs-on: macos-latest
    if: ${{ ! inputs.skip_macos }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS x64
        run: npx tauri build --target x86_64-apple-darwin

      - name: Show macOS x64 artifacts
        if: always()
        shell: bash
        run: |
          find \
            src-tauri/target/x86_64-apple-darwin/release/bundle \
            -type f \
            -print || true

      - name: Upload macOS x64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # macOS ARM64
  macos-arm64:
    runs-on: macos-latest
    if: ${{ ! inputs.skip_macos }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS ARM64
        run: npx tauri build --target aarch64-apple-darwin

      - name: Show macOS ARM64 artifacts
        if: always()
        shell: bash
        run: |
          find \
            src-tauri/target/aarch64-apple-darwin/release/bundle \
            -type f \
            -print || true

      - name: Upload macOS ARM64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Android
  android:
    runs-on: ubuntu-latest
    if: ${{ ! inputs.skip_android }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Configure Android environment
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "NDK=$ANDROID_SDK_ROOT/ndk/27.0.12077973"

          test -d "$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Android
        run: npx tauri android build --target aarch64

      - name: Find generated Android artifacts
        if: always()
        shell: bash
        run: |
          find \
            src-tauri/gen/android/app/build/outputs \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          APK_UNSIGNED="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          APK_SIGNED="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"

          if [ ! -f "$APK_UNSIGNED" ]; then
            echo "Unsigned APK not found: $APK_UNSIGNED"

            find \
              src-tauri/gen/android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.jks \
            --ks-key-alias key0 \
            --ks-pass pass:qzonearchive \
            --key-pass pass:qzonearchive \
            --out "$APK_SIGNED" \
            "$APK_UNSIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK_SIGNED"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error

  # Linux
  linux:
    runs-on: ubuntu-latest
    if: ${{ ! inputs.skip_linux }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux bundles
        run: npx tauri build --bundles appimage,deb,rpm

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # NixOS binary package
  nixos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ ! inputs.skip_nixos }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          date -u
          pwd
          git rev-parse --short HEAD
          nix --version
          node --version || true
          npm --version || true
          rustc --version || true
          cargo --version || true

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm ci

      - name: Build frontend and Tauri binary
        shell: bash
        run: |
          set -euo pipefail

          npm run build
          npx tauri build --no-bundle --ci

      - name: Verify built binary
        shell: bash
        run: |
          set -euo pipefail

          ls -lh src-tauri/target/release/qzonearchive
          file src-tauri/target/release/qzonearchive

      - name: Package Nix result
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/nix
          mkdir -p qzonearchive/bin qzonearchive/share/applications qzonearchive/share/icons/hicolor/512x512/apps

          cp src-tauri/target/release/qzonearchive qzonearchive/bin/qzonearchive
          cp src-tauri/icons/icon.png qzonearchive/share/icons/hicolor/512x512/apps/qzonearchive.png

          cat > qzonearchive/share/applications/qzonearchive.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=空间归档
          Comment=本地 QQ 空间归档工具
          Exec=bin/qzonearchive
          Icon=qzonearchive
          Categories=Utility;
          EOF

          tar -czf dist/nix/qzonearchive-nixos-x86_64-linux.tar.gz \
            qzonearchive
          ls -lh dist/nix

      - name: Upload NixOS package
        uses: actions/upload-artifact@v4
        with:
          name: nixos
          path: dist/nix/*.tar.gz
          if-no-files-found: error

  # iOS ARM64 unsigned IPA
  ios:
    # iOS builds must run on a macOS runner.
    runs-on: macos-15
    if: ${{ ! inputs.skip_ios }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Show Xcode version
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version
          xcode-select -p
          rustup target list --installed

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi

          pod --version
          ruby -e 'require "xcodeproj"; puts Xcodeproj::VERSION'

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Tauri CLI
        shell: bash
        run: |
          set -euo pipefail

          npx tauri --version

          if ! npx tauri ios build --help | grep -q -- "--no-sign"; then
            echo "The installed Tauri CLI does not support ios build --no-sign."
            echo "Please update @tauri-apps/cli to version 2.11 or newer."
            exit 1
          fi

      - name: Initialize iOS project
        shell: bash
        run: |
          set -euo pipefail

          # The repo does not commit gen/apple, so generate it in CI.
          rm -rf src-tauri/gen/apple
          npx tauri ios init --ci

      - name: Install custom iOS icons
        shell: bash
        run: |
          set -euo pipefail

          npx tauri icon \
            src-tauri/icons/qzone-archive-icon.png \
            --ios-color "#ffffff"

          APPICONSET="$(
            find src-tauri/gen/apple \
              -type d \
              -name "AppIcon.appiconset" \
              -print \
              -quit
          )"

          if [ -z "$APPICONSET" ] || [ ! -d "$APPICONSET" ]; then
            echo "Generated AppIcon.appiconset was not found."
            exit 1
          fi

          STORE_ICON="$APPICONSET/AppIcon-512@2x.png"
          test -f "$STORE_ICON"

          # ios-color fills transparent source pixels with the selected background.
          # sips hasAlpha only reports whether the PNG has an alpha channel;
          # it does not prove that transparent pixels exist.
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$STORE_ICON"

      - name: Configure iOS metadata and privacy manifest
        shell: bash
        run: |
          set -euo pipefail

          INFO_PLIST="$(
            find src-tauri/gen/apple \
              -type f \
              -name "Info.plist" \
              ! -path "*/LaunchScreen.storyboardc/*" \
              -print \
              -quit
          )"

          if [ -z "$INFO_PLIST" ] || [ ! -f "$INFO_PLIST" ]; then
            echo "Generated application Info.plist was not found."
            exit 1
          fi

          IOS_TARGET_DIR="$(dirname "$INFO_PLIST")"
          PRIVACY_MANIFEST="$IOS_TARGET_DIR/PrivacyInfo.xcprivacy"

          cat > "$PRIVACY_MANIFEST" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>NSPrivacyAccessedAPITypes</key>
              <array>
                <dict>
                  <key>NSPrivacyAccessedAPIType</key>
                  <string>NSPrivacyAccessedAPICategoryFileTimestamp</string>

                  <key>NSPrivacyAccessedAPITypeReasons</key>
                  <array>
                    <string>C617.1</string>
                  </array>
                </dict>
              </array>
            </dict>
          </plist>
          EOF

          plutil -lint "$INFO_PLIST"
          plutil -lint "$PRIVACY_MANIFEST"

          # ios init generates the xcodeproj already; add the manifest to the app
          # target Copy Bundle Resources phase explicitly.
          INFO_PLIST="$INFO_PLIST" PRIVACY_MANIFEST="$PRIVACY_MANIFEST" ruby <<'RUBY'
          require "xcodeproj"

          project_path = Dir["src-tauri/gen/apple/*.xcodeproj"].first
          abort "Generated Xcode project was not found." unless project_path

          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find do |candidate|
            candidate.product_type == "com.apple.product-type.application"
          end
          abort "iOS application target was not found." unless target

          info_plist = File.expand_path(ENV.fetch("INFO_PLIST"))
          privacy_manifest = File.expand_path(ENV.fetch("PRIVACY_MANIFEST"))
          info_ref = project.files.find do |file|
            file.real_path.to_s == info_plist
          end
          abort "Info.plist file reference was not found." unless info_ref

          group = info_ref.parent
          manifest_ref = project.files.find do |file|
            file.real_path.to_s == privacy_manifest
          end
          manifest_ref ||= group.new_file("PrivacyInfo.xcprivacy")

          unless target.resources_build_phase.files_references.include?(manifest_ref)
            target.resources_build_phase.add_file_reference(manifest_ref, true)
          end

          project.save
          RUBY

      - name: Build unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail

          npx tauri ios build \
            --target aarch64 \
            --ci \
            --no-sign \
            --build-number "${{ github.run_number }}"

      - name: Collect unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/ios

          IPA_PATH="$(
            find src-tauri/gen/apple \
              -type f \
              -name "*.ipa" \
              -print \
              -quit
          )"

          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "Unsigned IPA was not generated."

            find src-tauri/gen/apple \
              -type f \
              \( \
                -name "*.ipa" \
                -o -name "*.app" \
                -o -name "*.xcarchive" \
              \) \
              -print || true

            exit 1
          fi

          REF_NAME="${GITHUB_REF_NAME:-manual}"
          SAFE_REF_NAME="${REF_NAME//\//-}"

          OUTPUT_NAME="QzoneArchive-${SAFE_REF_NAME}-ios-arm64-unsigned.ipa"

          cp "$IPA_PATH" "dist/ios/$OUTPUT_NAME"

          echo "Generated IPA:"
          ls -lh "dist/ios/$OUTPUT_NAME"

          shasum -a 256 \
            "dist/ios/$OUTPUT_NAME" \
            > dist/ios/SHA256SUMS-ios.txt

          cat dist/ios/SHA256SUMS-ios.txt

      - name: Verify unsigned iOS IPA contents
        shell: bash
        run: |
          set -euo pipefail

          IPA_PATH="$(find dist/ios -type f -name "*.ipa" -print -quit)"
          VERIFY_DIR="$RUNNER_TEMP/qzonearchive-ios-verify"

          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$IPA_PATH" "$VERIFY_DIR"

          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name "*.app" -print -quit)"
          INFO_PLIST="$APP_PATH/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$INFO_PLIST")"
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$INFO_PLIST")"

          test "$EXECUTABLE" = "qzonearchive"
          test "$DISPLAY_NAME" = "空间归档"
          test -f "$APP_PATH/$EXECUTABLE"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          test -f "$APP_PATH/AppIcon60x60@2x.png"
          grep -a -q "assets/index-" "$APP_PATH/$EXECUTABLE"

          # Published releases must remain unsigned.
          test ! -d "$APP_PATH/_CodeSignature"
          test ! -f "$APP_PATH/embedded.mobileprovision"
          if codesign -d "$APP_PATH" >/dev/null 2>&1; then
            echo "Expected an unsigned iOS app, but a code signature was found."
            exit 1
          fi

          echo "Verified unsigned IPA:"
          echo "  executable: $EXECUTABLE"
          echo "  display name: $DISPLAY_NAME"
          echo "  privacy manifest: present"
          echo "  custom icon: present"
          echo "  embedded frontend: present"
          echo "  code signature: absent"

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: |
            dist/ios/*.ipa
            dist/ios/SHA256SUMS-ios.txt
          if-no-files-found: error

  # GitHub Release
  publish:
    needs:
      - windows
      - macos-x64
      - macos-arm64
      - android
      - ios
      - linux
      - nixos

    runs-on: ubuntu-latest

    # Manual workflow runs only produce Actions Artifacts;
    # pushing a v* tag creates a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      actions: read

    steps:
      - name: Download unsigned iOS artifact
        uses: actions/download-artifact@v7
        with:
          name: ios-unsigned
          path: artifacts/ios-unsigned

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows
          path: artifacts/windows

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-x64
          path: artifacts/macos-x64

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-arm64
          path: artifacts/macos-arm64

      - name: Download Android artifact
        uses: actions/download-artifact@v7
        with:
          name: android
          path: artifacts/android

      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: linux
          path: artifacts/linux

      - name: Download NixOS artifact
        uses: actions/download-artifact@v7
        with:
          name: nixos
          path: artifacts/nixos

      - name: Show release files
        shell: bash
        run: |
          set -euo pipefail

          find artifacts \
            -type f \
            -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/ios-unsigned/*.ipa
            artifacts/windows/**/*.exe
            artifacts/macos-x64/**/*.dmg
            artifacts/macos-arm64/**/*.dmg
            artifacts/android/**/*.apk
            artifacts/linux/**/*.AppImage
            artifacts/linux/**/*.deb
            artifacts/linux/**/*.rpm
            artifacts/nixos/**/*.tar.gz
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Installation

            This release includes Windows installers, macOS x64/ARM64 DMGs, Android APK,
            unsigned iOS IPA, plus Linux AppImage, deb, rpm and NixOS binary packages.

            The iOS IPA cannot be installed directly or uploaded to the App Store.

            iOS users need AltStore, SideStore, Sideloadly,
            TrollStore, or another signing tool to sign and install it.

            Unsigned IPA filenames contain `unsigned`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
