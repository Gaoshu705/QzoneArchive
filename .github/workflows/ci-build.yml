name: CI Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 90

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            artifact: macos-x64
          - target: aarch64-apple-darwin
            artifact: macos-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npx tauri build --target ${{ matrix.target }} --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-${{ matrix.artifact }}-${{ github.sha }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 90

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - run: npx tauri build --bundles appimage,deb,rpm
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 90

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx tauri android build --target aarch64
      - name: Sign Android APK
        run: |
          unsigned_apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          signed_apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.jks \
            --ks-key-alias key0 \
            --ks-pass pass:qzonearchive \
            --key-pass pass:qzonearchive \
            --out "$signed_apk" \
            "$unsigned_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$signed_apk"
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-android-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error
          retention-days: 90

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: npm ci
      - run: npx tauri ios init --ci
      - run: npx tauri ios build --target aarch64 --ci --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-ios-unsigned-${{ github.sha }}
          path: src-tauri/gen/apple/**/*.ipa
          if-no-files-found: error
          retention-days: 90

  nixos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Build NixOS package
        run: nix build -L .#qzonearchive
      - name: Package Nix closure
        run: |
          mkdir -p dist/nix
          store_path="$(readlink -f result)"
          echo "$store_path" > dist/nix/store-path.txt
          mapfile -t closure_paths < <(nix-store -qR "$store_path")
          nix-store --export "${closure_paths[@]}" > dist/nix/qzonearchive.closure
          cat > dist/nix/install.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          store_path="$(cat "$here/store-path.txt")"
          if [ -w /nix/store ]; then
            nix-store --option require-sigs false --import < "$here/qzonearchive.closure"
          else
            sudo nix-store --option require-sigs false --import < "$here/qzonearchive.closure"
          fi
          nix --extra-experimental-features "nix-command flakes" profile install "$store_path"
          echo "QzoneArchive installed. Run qzonearchive to start it."
          EOF
          chmod +x dist/nix/install.sh
          tar -czf dist/qzonearchive-nixos-x86_64-linux.tar.gz -C dist/nix .
      - uses: actions/upload-artifact@v4
        with:
          name: qzonearchive-nixos-${{ github.sha }}
          path: dist/qzonearchive-nixos-x86_64-linux.tar.gz
          if-no-files-found: error
          retention-days: 90
